[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cortaflow-ai"
version = "0.1.0"
description = "Editor desktop local para criação assistida de vídeos verticais."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
    "platformdirs==4.11.2",
    "pydantic==2.13.4",
    "PySide6==6.11.1",
    "yt-dlp[default,deno]==2026.7.4",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "av==18.1.0",
    "numpy==2.4.6",
    "pysubs2==1.8.1",
    "opencv-python==5.0.0.93",
    "scenedetect>=0.7,<1.0",
    "mediapipe==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.0",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
]

[project.gui-scripts]
cortaflow = "cortaflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
qt_api = "pyside6"
